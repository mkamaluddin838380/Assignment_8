<!DOCTYPE html>
<html>

<head>

    <title>Login Form</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            height: 100vh;
            background: linear-gradient(135deg, #5b4bc4, #7363d5, #65d9e8);
            font-family: Arial, sans-serif;
        }

        .login-box {
            width: 300px;
            height: 310px;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            padding-top: 112px;
            padding-left: 10px;
            padding-right: 10px;
            background: rgba(255, 255, 255, 0.03);
            box-shadow: 0 0 25px rgba(70, 70, 150, 0.15);
        }

        .input-box {
            margin-left: 50px;
        }

        .options {
            margin-left: 50px;
        }

        .login-btn {
            margin-left: 50px;
        }

        .profile {
            left: 101px;
        }


        .profile {
            width: 98px;
            height: 98px;
            position: absolute;
            top: 0;
            left: 101px;
        }

        .profile img {
            width: 98px;
            height: 98px;
            border-radius: 50%;
        }


        .input-box {
            width: 210px;
            height: 35px;
            margin-left: 45px;
            margin-bottom: 10px;
            background: white;
            position: relative;
        }

        .input-box span {
            position: absolute;
            left: 11px;
            top: 8px;
            color: #6080d8;
            font-size: 13px;
        }

        .input-box input {
            width: 170px;
            height: 35px;
            margin-left: 40px;
            border: none;
            outline: none;
            font-size: 12px;
            color: #777;
        }

        .input-box input::placeholder {
            color: #9aa1b7;
        }


        .options {
            width: 210px;
            margin-left: 45px;
            height: 22px;
            font-size: 8px;
            color: white;
        }

        .remember {
            float: left;
        }

        .remember input {
            width: 9px;
            height: 9px;
            vertical-align: middle;
            margin: 0 3px 0 0;
            accent-color: #3c42bb;
        }

        .forgot {
            float: right;
            color: white;
            font-style: italic;
        }


        .login-btn {
            width: 210px;
            height: 35px;
            margin-left: 45px;
            margin-top: 3px;
            border: none;
            background: #3941bd;
            color: white;
            font-size: 10px;
            letter-spacing: 2px;
            cursor: pointer;
        }


        .login-btn:hover {
            background: #292fa5;
        }

        .input-box:hover {
            box-shadow: 0 0 5px rgba(255, 255, 255, 0.8);
        }
    </style>

</head>


<body>

    <div class="login-box">

        <div class="profile">
            <img src="image1.png" alt="">
        </div>


        <div class="input-box">

            <span>♟</span>

            <input type="text" placeholder="Username">

        </div>


        <div class="input-box">

            <span>♙</span>

            <input type="password" placeholder="************">

        </div>


        <div class="options">

            <label class="remember">

                <input type="checkbox">

                Remember me

            </label>


            <span class="forgot">
                Forgot Password?
            </span>

        </div>


        <button class="login-btn">
            LOGIN
        </button>

    </div>

</body>

</html>
